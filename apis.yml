name: Mela Works
description: 'Mela Works (mela.work) is a mobile-first construction and maintenance
  site-management platform that connects field teams with the back office. It turns
  voice dictation into structured daily reports and site minutes using AI, manages
  an annotated cloud photo archive, tracks attendance with clock-in/clock-out, reads
  DDT/invoices, controls costs (AI-calculated hours and materials), and produces blockchain-notarized
  digital site logs with legal/evidential validity. The app works offline with automatic
  sync and is offered in Italian, English, and Spanish for construction firms, works
  directors (DL), safety coordinators (CSE), and installers. It integrates with WhatsApp,
  Google Calendar, Outlook, Gmail, Excel, and accounting/management systems (RIB Presto,
  Holded, Billin, Zucchetti). Mela Works is a Techstars portfolio company. As of this
  enrichment pass it publishes no public developer API, SDK, or webhook surface.'
